name: Build XR1710G OpenWrt

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BOARD: airoha

jobs:
  toolchain:
    name: Build cross toolchain + cache
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang flex bison g++ gettext texinfo ncurses-dev \
            zlib1g-dev libssl-dev python3 python3-pip python3-setuptools \
            unzip wget gawk gcc-multilib gnutls-bin jq time rsync

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target (Airoha AN7581 / XR1710G)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config || { echo "::error::target config failed"; exit 1; }

      - name: Restore dl/ download cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-airoha-x64-v1
          restore-keys: dl-airoha-

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: staging_dir/toolchain-*
          key: tc-airoha-aarch64-${{ hashFiles('toolchain/**/Makefile', 'target/linux/airoha/Makefile') }}
          restore-keys: tc-airoha-aarch64-

      - name: Build cross toolchain
        run: |
          set -o pipefail
          make -j"$(($(nproc) - 1))" toolchain/install V=s 2>&1 | tee -a build.log

      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: staging_dir/toolchain-*
          key: tc-airoha-aarch64-${{ hashFiles('toolchain/**/Makefile', 'target/linux/airoha/Makefile') }}
          enableCrossOsArchive: true

      - name: Save dl/ download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-airoha-x64-v1

      - name: Upload toolchain build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-build-log
          path: build.log*
          retention-days: 7

  image:
    name: Build XR1710G firmware image
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang flex bison g++ gettext texinfo ncurses-dev \
            zlib1g-dev libssl-dev python3 python3-pip python3-setuptools \
            unzip wget gawk gcc-multilib gnutls-bin jq time rsync

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Restore dl/ download cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-airoha-x64-v1
          restore-keys: dl-airoha-

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: staging_dir/toolchain-*
          key: tc-airoha-aarch64-${{ hashFiles('toolchain/**/Makefile', 'target/linux/airoha/Makefile') }}
          restore-keys: tc-airoha-aarch64-

      - name: Configure target (Airoha AN7581 / XR1710G)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config || { echo "::error::target config failed"; exit 1; }

      - name: Build firmware image (make world)
        run: |
          set -o pipefail
          # OpenWrt master has no 'make image' target anymore - the default
          # 'world' goal builds everything selected in .config, and image
          # generation happens as part of the target install step.
          make -j"$(($(nproc) - 1))" V=s 2>&1 | tee -a build.log

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/ipk artifacts/kmods
          cp -a bin/targets/airoha/an7581/. artifacts/ 2>/dev/null || true
          cp -a bin/packages/aarch64_cortex-a53/. artifacts/ipk/ 2>/dev/null || true
          mkdir -p artifacts/kmods
          find bin -maxdepth 3 -type f | head -60

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-firmware
          path: |
            bin/targets/airoha/an7581/
            bin/packages/aarch64_cortex-a53/
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-log
          path: build.log*
          retention-days: 7

      - name: Create GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.bin
            bin/targets/airoha/an7581/sha256sums
          fail_on_unmatched_files: false